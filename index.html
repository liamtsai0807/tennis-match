<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TennisPal" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>TennisPal 網球夥伴</title>
  </head>
  <body>
    <!--
      先畫一塊骨架，不要留白。

      主 bundle 有 460 KB（React + supabase-js 就佔了大半），手機上光下載
      加解析就要一兩秒。那段時間畫面完全空白，使用者的感受是「當掉了」，
      而不是「在載入」。

      這一段是行內樣式與內容，跟著 HTML 一起到，第一次繪製就看得到東西。
      React 掛載時會直接覆蓋掉 #root 的內容，不需要額外清理。
      背景色與字體要跟 App 一致，否則會閃一下。
    -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#faf9f7;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif">
        <div style="font-size:44px;line-height:1">🎾</div>
        <div style="font-size:19px;font-weight:800;color:#17150f;letter-spacing:.01em">TennisPal</div>
        <div style="font-size:12.5px;color:#8f8880">載入中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
