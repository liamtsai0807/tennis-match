name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 手動也能觸發，改了 Secrets 之後不必空推一個 commit 才重新部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署。連續 push 時取消排隊中的舊的，但不打斷正在跑的那個。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 版本字串取自 git 短雜湊，淺層 clone 就夠
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # 測試用 node --experimental-strip-types 直接跑 .ts，需要 22
          node-version: 22
          cache: npm

      - run: npm ci

      # 測試與型別檢查沒過就不要部署。媒合與程度推算算錯不會當機，
      # 只會默默推薦錯的人，靠這一關擋住。
      - name: 跑測試
        run: npm test

      - name: 型別檢查
        run: npx tsc -b

      # 建置前先擋。沒設好就部署出去的話，App 會安靜地退回離線示範模式：
      # 畫面全都在、點得完所有流程，但東西只存在那台裝置，而且不會有任何
      # 錯誤訊息。這種壞法可能一週後才有人發現，不如當場失敗。
      - name: 確認建置設定齊全
        run: |
          missing=""
          [ -z "${{ vars.VITE_SUPABASE_URL }}" ] && missing="$missing VITE_SUPABASE_URL(variable)"
          [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] && missing="$missing VITE_SUPABASE_ANON_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::缺少建置設定：$missing"
            echo "::error::到 repo Settings → Secrets and variables → Actions 設定："
            echo "::error::  Variables: VITE_SUPABASE_URL, VITE_LINE_LIFF_ID"
            echo "::error::  Secrets:   VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      # Vite 的環境變數是**建置時**烤進 bundle 的，不是執行期讀的。
      #
      # anon key 照設計就是公開的（真正的防線是 RLS），但還是放 Secrets，
      # 免得日後有人把它跟 service_role key 搞混。
      - name: 建置
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LINE_LIFF_ID: ${{ vars.VITE_LINE_LIFF_ID }}

      # 再確認那個網址真的進到產物裡了。
      #
      # 這裡比對的是完整網址，不是 "supabase.co"——@supabase/supabase-js 自己
      # 的程式碼裡就有 "*.supabase.co" 這個字串，拿它當關鍵字的話永遠會中，
      # 檢查等於沒做。（第一版就是這樣寫的，反向測試才抓出來。）
      - name: 確認後端真的被烤進去
        run: |
          if ! grep -rqF "${{ vars.VITE_SUPABASE_URL }}" dist/assets/*.js; then
            echo "::error::建置產物裡找不到 ${{ vars.VITE_SUPABASE_URL }}"
            echo "::error::App 會跑成離線示範模式，部署中止。"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
